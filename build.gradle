plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rk.familyaccounting'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rk.familyaccounting'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
}
